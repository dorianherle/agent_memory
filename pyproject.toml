[project]
name = "agent-memory"
version = "0.1.0"
description = "Git-backed memory for long-running research agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hnswlib>=0.8.0",
    "numpy>=2.2.6",
]

[project.optional-dependencies]
cursor = ["mcp>=1.2"]
gemini = ["google-genai"]
test = ["pytest>=8", "mcp>=1.2"]

[project.scripts]
agent-memory = "agent_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_memory"]
