[project]
name = "agent-memory"
version = "0.1.0"
description = "Git-backed memory for long-running research agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Semantic search only. The core needs nothing.
search = ["numpy", "google-genai", "python-dotenv"]
# The agents that drive the memory.
controller = ["openai-agents[litellm]>=0.19", "pytest>=8", "python-dotenv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory", "controller"]
