[project]
name = "agent-memory"
version = "0.1.0"
description = "Git-backed memory for long-running research agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hnswlib>=0.8.0",
    "numpy>=2.2.6",
]

[project.optional-dependencies]
# FastMCP lives in mcp 1.x; mcp 2.0 removed it
cursor = ["mcp>=1.2,<2", "google-genai"]
gemini = ["google-genai"]
studio = ["cursor-sdk"]
test = ["pytest>=8", "mcp>=1.2,<2", "google-genai"]
benchmark = ["tiktoken>=0.7"]

[project.scripts]
agent-memory = "agent_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_memory"]

[tool.hatch.build.targets.wheel.force-include]
"agent_memory/studio.html" = "agent_memory/studio.html"
