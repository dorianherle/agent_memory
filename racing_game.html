<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JS Racing Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
        }

        #game-container {
            position: relative;
        }

        canvas {
            background-color: #555; /* Road color */
            border: 5px solid #fff;
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            visibility: hidden;
        }

        button {
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            background: #2ecc71;
            border: none;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div id="score">Score: 0</div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div id="overlay">
            <h1>GAME OVER!</h1>
            <p id="final-score"></p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const finalScoreElement = document.getElementById('final-score');

        // Game Constants
        const CAR_WIDTH = 50;
        const CAR_HEIGHT = 90;
        const LANE_WIDTH = canvas.width / 3;
        
        let score = 0;
        let gameActive = true;
        let speed = 5;
        let enemies = [];
        let keys = {};

        // Player Object
        const player = {
            x: canvas.width / 2 - CAR_WIDTH / 2,
            y: canvas.height - CAR_HEIGHT - 20,
            width: CAR_WIDTH,
            height: CAR_HEIGHT,
            color: '#3498db', // Blue
            speed: 7
        };

        // Input Listeners
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function spawnEnemy() {
            const lanes = [
                LANE_WIDTH / 2 - CAR_WIDTH / 2,
                canvas.width / 2 - CAR_WIDTH / 2,
                (canvas.width * 1.5) / 2 - CAR_WIDTH / 2 // simplified 3rd lane
            ];
            // Pick a random lane
            const randomLane = Math.floor(Math.random() * 3);
            const laneX = (randomLane * (canvas.width / 3)) + (canvas.width/6) - (CAR_WIDTH/2);
            
            enemies.push({
                x: laneX,
                y: -CAR_HEIGHT,
                width: CAR_WIDTH,
                height: CAR_HEIGHT,
                color: '#e74c3c' // Red
            });
        }

        function drawRect(obj) {
            ctx.fillStyle = obj.color;
            ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
            
            // Add some detail (windshield)
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillRect(obj.x + 5, obj.y + 15, obj.width - 10, 20);
        }

        function drawRoad() {
            // Draw white dashed lines
            ctx.strokeStyle = '#fff';
            ctx.setLineDash([20, 20]);
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 3, 0);
            ctx.lineTo(canvas.width / 3, canvas.height);
            ctx.moveTo((canvas.width / 3) * 2, 0);
            ctx.lineTo((canvas.width / 3) * 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); 
        }

        function update() {
            if (!gameActive) return;

            // Move Player
            if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Update Enemies
            if (Math.random() < 0.02) spawnEnemy(); // Chance to spawn new car

            enemies.forEach((enemy, index) => {
                enemy.y += speed;

                // Collision Detection
                if (
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y
                ) {
                    gameOver();
                }

                // Remove off-screen enemies
                if (enemy.y > canvas.height) {
                    enemies.splice(index, 1);
                    score++;
                    scoreElement.innerText = `Score: ${score}`;
                    // Increase difficulty
                    if (score % 10 === 0) speed += 0.1;
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRoad();
            drawRect(player);
            enemies.forEach(enemy => drawRect(enemy));
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            overlay.style.visibility = 'visible';
            finalScoreElement.innerText = `You scored ${score} points!`;
        }

        function resetGame() {
            score = 0;
            speed = 5;
            enemies = [];
            player.x = canvas.width / 2 - CAR_WIDTH / 2;
            scoreElement.innerText = `Score: 0`;
            overlay.style.visibility = 'hidden';
            gameActive = true;
        }

        gameLoop();
    </script>
</body>
</html>
