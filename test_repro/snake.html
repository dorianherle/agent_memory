<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    :root {
      --bg: #12141a;
      --panel: #1c1f28;
      --grid: #0e1014;
      --snake: #6ee7b7;
      --head: #34d399;
      --food: #fb7185;
      --text: #e8eaed;
      --muted: #9aa3b2;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    .wrap {
      width: min(92vw, 560px);
      background: var(--panel);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }
    .score {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    canvas {
      display: block;
      width: 100%;
      background: var(--grid);
      border-radius: 10px;
    }
    p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Snake</h1>
      <div class="score">Score: <span id="score">0</span></div>
    </header>
    <canvas id="board" width="400" height="400"></canvas>
    <p>Arrow keys or WASD to move. Space to restart after a crash.</p>
  </div>
  <script>
    const SIZE = 20;
    const CELLS = 20;
    const TICK_MS = 110;
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");

    let snake, dir, pending, food, score, alive, timer;

    function reset() {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      dir = { x: 1, y: 0 };
      pending = dir;
      score = 0;
      alive = true;
      scoreEl.textContent = score;
      placeFood();
      clearInterval(timer);
      timer = setInterval(tick, TICK_MS);
      draw();
    }

    function placeFood() {
      const taken = new Set(snake.map((p) => p.x + "," + p.y));
      let x, y;
      do {
        x = Math.floor(Math.random() * CELLS);
        y = Math.floor(Math.random() * CELLS);
      } while (taken.has(x + "," + y));
      food = { x, y };
    }

    function tick() {
      if (!alive) return;
      dir = pending;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
      const hitSelf = snake.some((p) => p.x === head.x && p.y === head.y);
      if (hitWall || hitSelf) {
        alive = false;
        draw();
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 1;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = "#0e1014";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fb7185";
      ctx.fillRect(food.x * SIZE + 3, food.y * SIZE + 3, SIZE - 6, SIZE - 6);
      snake.forEach((p, i) => {
        ctx.fillStyle = i === 0 ? "#34d399" : "#6ee7b7";
        ctx.fillRect(p.x * SIZE + 1, p.y * SIZE + 1, SIZE - 2, SIZE - 2);
      });
      if (!alive) {
        ctx.fillStyle = "rgba(18, 20, 26, 0.62)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#e8eaed";
        ctx.textAlign = "center";
        ctx.font = "bold 28px ui-sans-serif, system-ui, sans-serif";
        ctx.fillText("Game over", canvas.width / 2, canvas.height / 2 - 8);
        ctx.font = "16px ui-sans-serif, system-ui, sans-serif";
        ctx.fillStyle = "#9aa3b2";
        ctx.fillText("Press space to restart", canvas.width / 2, canvas.height / 2 + 22);
      }
    }

    const keys = {
      ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 }, s: { x: 0, y: 1 },
      a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
      W: { x: 0, y: -1 }, S: { x: 0, y: 1 },
      A: { x: -1, y: 0 }, D: { x: 1, y: 0 },
    };

    document.addEventListener("keydown", (e) => {
      if (e.key === " " && !alive) {
        e.preventDefault();
        reset();
        return;
      }
      const next = keys[e.key];
      if (!next) return;
      e.preventDefault();
      if (next.x + dir.x === 0 && next.y + dir.y === 0) return;
      pending = next;
    });

    reset();
  </script>
</body>
</html>
